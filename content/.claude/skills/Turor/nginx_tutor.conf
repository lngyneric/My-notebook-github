
# Nginx Configuration for Academic Tutor
# Copy this content to your Nginx configuration file (e.g., /etc/nginx/conf.d/tutor.conf)
# or include it in your nginx.conf

upstream tutor_api_backend {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name tool.sysmex.com.cn;

    # Redirect HTTP to HTTPS (Recommended)
    # return 301 https://$host$request_uri;
    
    # Static Files (H5 Application)
    # Ensure h5_chatbot.html is in this directory
    location /hr {
        alias C:/Users/lingyun/Documents/BaiduSyncdisk/xcxnotes/content/.claude/skills/Turor;
        index h5_chatbot.html;
        try_files $uri $uri/ /h5_chatbot.html;
    }

    # Verify File for WeCom (Place the txt file in the root or alias)
    # location /WW_verify_GwBxxxxxx.txt {
    #     alias C:/Users/lingyun/Documents/BaiduSyncdisk/xcxnotes/content/.claude/skills/Turor/WW_verify_GwBxxxxxx.txt;
    # }

    # API Proxy
    location /hr/api/ {
        proxy_pass http://tutor_api_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket Support (if needed for future)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
